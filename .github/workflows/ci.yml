name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Type-Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (TypeScript)
        run: npm run type-check

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Build Library & Styles
        run: npm run build

      - name: Verify Package Tarball
        run: npm run package

      - name: Validate Sample Application
        run: |
          cd samples/simple-app
          npm ci
          npm run build
